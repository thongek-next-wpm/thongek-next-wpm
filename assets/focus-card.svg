<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-label="Career Transition Matrix: IT Support to Software Developer">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#14182B" />
    </linearGradient>

    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363D" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect x="2" y="2" width="516" height="376" rx="16" fill="url(#cardBg)" stroke="url(#strokeGrad)" stroke-width="1.5" />

  <!-- Header -->
  <circle cx="28" cy="30" r="5" fill="#38BDF8" />
  <circle cx="44" cy="30" r="5" fill="#A855F7" />
  <text x="62" y="35" class="mono" font-size="13.5" font-weight="700" letter-spacing="1" fill="#8B949E">CAREER_PATH.JSON</text>
  <line x1="20" y1="50" x2="500" y2="50" stroke="#21262D" stroke-width="1" />

  <!-- Stage 1: Foundation -->
  <rect x="24" y="68" width="472" height="106" rx="12" fill="#161B22" stroke="#1F6FEB" stroke-opacity="0.45" stroke-width="1.2" />
  <rect x="40" y="82" width="112" height="22" rx="6" fill="#38BDF8" fill-opacity="0.14" />
  <text x="96" y="97" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#38BDF8">FOUNDATION</text>

  <text x="40" y="128" class="sans" font-size="19" font-weight="700" fill="#F0F6FC">IT Support &amp; System Ops</text>
  <text x="40" y="154" class="sans" font-size="13.5" fill="#94A3B8">Troubleshooting • Network Labs • TH POP Firewalls</text>

  <!-- Connector Arrow -->
  <line x1="260" y1="176" x2="260" y2="206" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-linecap="round" />
  <polygon points="253,200 267,200 260,210" fill="#A855F7" />

  <!-- Stage 2: Building Towards -->
  <rect x="24" y="214" width="472" height="106" rx="12" fill="#161B22" stroke="#A855F7" stroke-opacity="0.55" stroke-width="1.2" />
  <rect x="40" y="228" width="130" height="22" rx="6" fill="#A855F7" fill-opacity="0.16" />
  <text x="105" y="243" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#C084FC">NEXT MILESTONE</text>

  <text x="40" y="274" class="sans" font-size="19" font-weight="700" fill="#F0F6FC">Full-Stack Software Developer</text>
  <text x="40" y="300" class="sans" font-size="13.5" fill="#94A3B8">Scalable Web Apps • IoT Solutions • Open Source</text>

  <!-- Bottom Principle Footer -->
  <rect x="24" y="334" width="472" height="28" rx="8" fill="#0F172A" stroke="#21262D" stroke-width="1" />
  <text x="260" y="352.5" text-anchor="middle" class="mono" font-size="12" fill="#CBD5E1">"Understand systems deeply — build better software."</text>
</svg>
