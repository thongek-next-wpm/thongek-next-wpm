<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Thongek Next Wongpomon - IT Support to Software Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1A1033" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363D" />
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="accentBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00AEFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00AEFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>

    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8B949E" opacity="0.16" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="4" y="4" width="1192" height="312" rx="20" />
    </clipPath>

    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.85); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -36; }
      }
      .status-dot { transform-box: fill-box; transform-origin: center; animation: pulseDot 2.4s ease-in-out infinite; }
      .float-card { animation: floatSlow 5s ease-in-out infinite; }
      .dash-flow { stroke-dasharray: 6 6; animation: dashFlow 2.2s linear infinite; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base & Dot Matrix -->
    <rect x="4" y="4" width="1192" height="312" rx="20" fill="url(#bgGrad)" />
    <rect x="4" y="4" width="1192" height="312" fill="url(#dotGrid)" />

    <!-- Ambient Glows -->
    <circle cx="190" cy="70" r="260" fill="url(#glowPurple)" />
    <circle cx="1010" cy="250" r="280" fill="url(#glowCyan)" />
    <circle cx="840" cy="110" r="180" fill="url(#glowPink)" />

    <!-- Top Terminal Chrome Bar -->
    <circle cx="38" cy="36" r="6" fill="#FF5F56" />
    <circle cx="60" cy="36" r="6" fill="#FFBD2E" />
    <circle cx="82" cy="36" r="6" fill="#27C93F" />
    <text x="106" y="41" class="mono" font-size="13.5" fill="#8B949E">~/thongek-next-wpm/README.md</text>

    <!-- Top-Right Role Pill -->
    <rect x="914" y="20" width="250" height="32" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="936" cy="36" r="4.5" fill="#3FB950" class="status-dot" />
    <text x="952" y="40.5" class="mono" font-size="12.5" fill="#E6EDF3">IT Support → Developer</text>

    <!-- Header Divider -->
    <line x1="28" y1="64" x2="1172" y2="64" stroke="#21262D" stroke-width="1" />

    <!-- Left Content -->
    <text x="52" y="106" class="sans" font-size="14" font-weight="700" letter-spacing="1.4" fill="#38BDF8">HELLO, WORLD!  •  สวัสดีครับ</text>

    <text x="52" y="158" class="sans" font-size="40" font-weight="800" fill="#F8FAFC">Thongek "Next" Wongpomon</text>

    <!-- Accent Bar + Thai Name -->
    <rect x="52" y="177" width="4" height="32" rx="2" fill="url(#accentBar)" />
    <text x="68" y="202" class="sans" font-size="25" font-weight="600" fill="#CBD5E1">ทองเอก "เน็กซ์" วงษ์โพธิ์มณ</text>

    <!-- Quick Identity Pills -->
    <g transform="translate(52, 236)">
      <rect x="0" y="0" width="224" height="36" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <circle cx="18" cy="18" r="4" fill="#38BDF8" />
      <text x="32" y="23" class="sans" font-size="13.5" font-weight="600" fill="#E2E8F0">IT Support &amp; Developer</text>

      <rect x="236" y="0" width="234" height="36" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <circle cx="254" cy="18" r="4" fill="#A855F7" />
      <text x="268" y="23" class="sans" font-size="13.5" font-weight="600" fill="#E2E8F0">Full-Stack &amp; Network Labs</text>

      <rect x="482" y="0" width="190" height="36" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <circle cx="500" cy="18" r="4" fill="#EC4899" />
      <text x="514" y="23" class="sans" font-size="13.5" font-weight="600" fill="#E2E8F0">Based in Thailand</text>
    </g>

    <!-- Right Graphic: Network Infrastructure -> Code Window Motif -->
    <g transform="translate(790, 92)">
      <!-- Subtle Orbital Arcs -->
      <circle cx="210" cy="96" r="112" fill="none" stroke="#30363D" stroke-width="1" stroke-dasharray="4 6" opacity="0.7" />
      <circle cx="210" cy="96" r="76" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.28" />

      <!-- Network Nodes on Left feeding into Code Card -->
      <path d="M 32 48 C 80 48, 86 82, 128 82" fill="none" stroke="url(#flowLine)" stroke-width="2" class="dash-flow" />
      <path d="M 18 100 L 128 100" fill="none" stroke="url(#flowLine)" stroke-width="2" class="dash-flow" />
      <path d="M 38 152 C 82 152, 88 118, 128 118" fill="none" stroke="url(#flowLine)" stroke-width="2" class="dash-flow" />

      <!-- Node Badges -->
      <circle cx="32" cy="48" r="14" fill="#161B22" stroke="#38BDF8" stroke-width="1.5" />
      <text x="32" y="52.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#38BDF8">NET</text>

      <circle cx="18" cy="100" r="14" fill="#161B22" stroke="#A855F7" stroke-width="1.5" />
      <text x="18" y="104.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#A855F7">OPS</text>

      <circle cx="38" cy="152" r="14" fill="#161B22" stroke="#EC4899" stroke-width="1.5" />
      <text x="38" y="156.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#EC4899">IOT</text>

      <!-- Floating Code Card -->
      <g class="float-card">
        <rect x="128" y="24" width="232" height="148" rx="14" fill="#0F172A" fill-opacity="0.92" stroke="url(#borderGrad)" stroke-width="1.5" />
        <rect x="128" y="24" width="232" height="28" rx="14" fill="#1E293B" fill-opacity="0.7" />
        <rect x="128" y="40" width="232" height="12" fill="#1E293B" fill-opacity="0.7" />
        <circle cx="146" cy="38" r="3.5" fill="#FF5F56" />
        <circle cx="158" cy="38" r="3.5" fill="#FFBD2E" />
        <circle cx="170" cy="38" r="3.5" fill="#27C93F" />
        <text x="186" y="42" class="mono" font-size="11" fill="#94A3B8">next.config.ts</text>

        <!-- Clean Code Lines with tspan for exact spacing -->
        <text x="144" y="74" class="mono" font-size="12">
          <tspan fill="#A855F7">const</tspan> <tspan fill="#38BDF8">dev</tspan> <tspan fill="#E2E8F0">= {</tspan>
        </text>
        <text x="158" y="96" class="mono" font-size="11.5">
          <tspan fill="#94A3B8">from:</tspan> <tspan fill="#3FB950">"IT Support"</tspan><tspan fill="#E2E8F0">,</tspan>
        </text>
        <text x="158" y="116" class="mono" font-size="11.5">
          <tspan fill="#94A3B8">to:</tspan> <tspan fill="#F472B6">"Software Dev"</tspan><tspan fill="#E2E8F0">,</tspan>
        </text>
        <text x="158" y="136" class="mono" font-size="11.5">
          <tspan fill="#94A3B8">stack:</tspan> <tspan fill="#FBBF24">["Web", "IoT"]</tspan>
        </text>
        <text x="144" y="156" class="mono" font-size="12" fill="#E2E8F0">};</text>
      </g>
    </g>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="4" y="4" width="1192" height="312" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
</svg>
